<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        .table {
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 1s;
        }

        .table thead th {
            border-top: none;
            background-color: #007bff;
            color: white;
            font-weight: 500;
        }

        .table td, .table th {
            border-color: #dee2e6;
            vertical-align: middle;
        }

        .btn {
            transition: all 0.3s ease;
            margin: 0 2px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .table tbody tr {
            transition: all 0.3s ease;
        }

        .table tbody tr:hover {
            background-color: #f1f1f1;
        }

        .action-buttons {
            white-space: nowrap;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-style: italic;
        }

        .page-title {
            color: #007bff;
            font-weight: bold;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .new-expense-btn {
            margin-bottom: 30px;
            padding: 10px 30px;
            font-weight: 500;
        }

          .summary-card {
        background: linear-gradient(135deg, #007bff, #0056b3);
        color: white;
        border-radius: 8px;
        padding: 12px 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        width: 300px;
    }

    .summary-title {
        font-size: 0.8rem;
        opacity: 0.9;
        margin: 0;
    }

    .summary-value {
        font-size: 1.2rem;
        font-weight: bold;
    }

    .gap-4 {
        gap: 1.5rem;
    }
    </style>
</head>
<body>
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center page-title animate__animated animate__fadeInDown">
        <h1>
            <i class="fas fa-wallet mr-2"></i>Expense Tracker
        </h1>
        <div class="summary-card animate__animated animate__fadeInLeft">
            <div class="d-flex align-items-center">
                <i class="fas fa-money-bill-wave mr-2"></i>
                <div>
                    <small class="d-block summary-title">Total Expenses</small>
                    <span class="summary-value" th:text="${'$ ' + #numbers.formatDecimal(totalAmount, 0, 'COMMA', 2, 'POINT')}">$0.00</span>
                </div>
            </div>
        </div>
    </div>



    <div class="text-center mb-4 animate__animated animate__fadeInUp">
        <a th:href="@{/expense/new}" class="btn btn-primary btn-lg new-expense-btn">
            <i class="fas fa-plus mr-2"></i>New Expense
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th><i class="fas fa-file-alt mr-2"></i>Description</th>
                <th><i class="fas fa-tag mr-2"></i>Category</th>
                <th><i class="fas fa-dollar-sign mr-2"></i>Amount</th>
                <th><i class="fas fa-calendar-alt mr-2"></i>Date</th>
                <th class="text-center"><i class="fas fa-cogs mr-2"></i>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="5" class="empty-message">
                    No expenses found. Start by adding a new expense!
                </td>
            </tr>
            <tr th:each="expense : ${expenses}" class="animate__animated animate__fadeInUp">
                <td th:text="${expense.description}"></td>
                <td>
                    <span class="badge badge-info" th:text="${expense.category}"></span>
                </td>
                <td>
                    <span class="text-success font-weight-bold">$</span>
                    <span th:text="${#numbers.formatDecimal(expense.amount, 0, 2)}"></span>
                </td>
                <td th:text="${@customUtils.formatDate(expense.date)}"></td>
                <td class="text-center action-buttons">
                    <a th:href="@{'/expense/' + ${expense.id} + '/edit'}"
                       class="btn btn-primary btn-sm"
                       title="Edit Expense">
                        <i class="fas fa-edit"></i> Edit
                    </a>

                    <form th:action="@{'/expense/' + ${expense.id} + '/delete'}"
                          method="post"
                          style="display: inline;">
                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('Are you sure you want to delete this expense?')"
                                title="Delete Expense">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
